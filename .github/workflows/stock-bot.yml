name: Wirestock Bot

on:
  schedule:
    - cron: "0 1,7,13,19 * * *" # 4x daily: 1AM, 7AM, 1PM, 7PM UTC (6AM, 12PM, 6PM, 12AM PKT)
  workflow_dispatch:

concurrency:
  group: wirestock-bot
  cancel-in-progress: false

env:
  GROQ_API_KEY: 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
  GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
  SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
  RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt1-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Health Check
        run: |
          echo "GROQ_API_KEY is set: ${GROQ_API_KEY:0:10}..."
          python harness/health_check.py quick || {
            echo "Health check failed — aborting pipeline"
            exit 1
          }

      - name: Run pipeline
        run: python scripts/pipeline.py

      - name: Commit updated logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stock_log.json
          git diff --cached --quiet || git commit -m "Update stock logs [skip ci]"
          git push
